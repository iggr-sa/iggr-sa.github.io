<!doctype html>
<html lang="en">
<head>

  <title>Site navigation</title>
  <link rel="stylesheet" href="common/igeth.css">
  <style>
    body {
      box-sizing: border-box;
      margin: 0;
      padding: 30px 8px 16px;
      background: #fff7d2;
      color: #000;
      font: 10pt Verdana, Arial, sans-serif;
    }

    .sidebar {
      width: 143px;
      margin: 0 auto;
    }

    .brand,
    .partners,
    .footer {
      text-align: center;
    }

    .brand img {
      width: 132px;
      height: 81px;
    }

    nav {
      margin: 24px 0 30px;
    }

    nav ul {
      margin: 0;
      padding: 0;
      list-style: none;
    }

    nav li {
      margin: 0 0 9px;
    }

    nav a {
      color: #000;
      font-weight: bold;
      text-decoration: none;
    }

    nav a img {
      width: 15px;
      height: 12px;
      margin-right: 4px;
      vertical-align: middle;
    }

    .partners {
      display: grid;
      justify-items: center;
      gap: 12px;
    }

    .partners img {
      max-width: 120px;
      height: auto;
    }

    .partners img[src="pictures/WIS.gif"],
    .partners img[src="pictures/uni.jpg"] {
      width: 120px;
      height: 60px;
      object-fit: fill;
    }

    .footer {
      margin-top: 30px;
      font-size: 10pt;
    }

</head>
